pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 引入 HtmlCraftAPI Fabric 子项目（复合构建，dev 环境可直接源码调试）
includeBuild '../HtmlCraftAPI/fabric'

// Should match your modid
rootProject.name = 'calendarmod'
